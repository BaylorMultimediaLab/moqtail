[package]
name = "relay"
version = "0.14.1"
edition = "2024"
build="build.rs"

[dependencies]
anyhow = "1.0.97"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# dangerous-configuration: the upstream relay link (--upstream-url) can dial a
# relay presenting a self-signed certificate when --upstream-no-cert-validation
# is set; validation stays on by default at runtime.
wtransport = { workspace = true, features = ["dangerous-configuration"] }
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0.140"
bytes = "1.10.1"
moqtail = { version = "*", path = "../../libs/moqtail-rs" }
clap = { version = "4.5.40", features = ["derive"] }
tracing-appender = "0.2"
once_cell = "1.21.3"
moka = { version = "0.12", features = ["future"] }
fnv = "1.0.7"
hex = "0.4"
socket2 = "0.6"

[dev-dependencies]
# Integration tests may generate a self-signed identity for a spawned relay and skip
# cert validation on the test client; these features only affect test builds.
wtransport = { workspace = true, features = ["self-signed", "dangerous-configuration"] }
